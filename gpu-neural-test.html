<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ふれあいの森AI GPU Neural Network</title>

</head>


<body>

<h1>🌲 ふれあいの森AI</h1>

<h2>GPUニューラルネットテスト</h2>

<p id="status">
準備中……
</p>


<script>

async function main() {

    const status =
        document.getElementById("status");


    // =====================================
    // 1. WebGPU確認
    // =====================================

    if (!navigator.gpu) {

        status.textContent =
            "❌ WebGPUが利用できません";

        return;
    }


    // =====================================
    // 2. GPU取得
    // =====================================

    const adapter =
        await navigator.gpu.requestAdapter();


    if (!adapter) {

        status.textContent =
            "❌ GPUアダプターを取得できません";

        return;
    }


    const device =
        await adapter.requestDevice();


    // =====================================
    // 3. ニューラルネット
    //
    // 入力 2
    // ↓
    // 隠れ層 4
    // ↓
    // 出力 1
    //
    // 今回は
    //
    // [2, 3]
    //
    // を入力する
    // =====================================


    const inputSize = 2;

    const hiddenSize = 4;

    const outputSize = 1;


    // =====================================
    // 4. 入力データ
    // =====================================

    const input =
        new Float32Array([2, 3]);


    // =====================================
    // 5. 重み
    //
    // 今回はテスト用に
    // すべて分かりやすい数字にする
    // =====================================

    const W1 =
        new Float32Array([

            0.5, 0.2,

            0.1, 0.3,

            0.4, 0.6,

            0.2, 0.7

        ]);


    const B1 =
        new Float32Array([

            0,
            0,
            0,
            0

        ]);


    const W2 =
        new Float32Array([

            0.5,
            0.4,
            0.3,
            0.2

        ]);


    const B2 =
        new Float32Array([0]);


    // =====================================
    // 6. GPUバッファ作成
    // =====================================

    function createBuffer(
        data,
        usage
    ) {

        const buffer =
            device.createBuffer({

                size:
                    Math.max(
                        data.byteLength,
                        4
                    ),

                usage:
                    usage |
                    GPUBufferUsage.COPY_DST

            });


        device.queue.writeBuffer(

            buffer,

            0,

            data

        );


        return buffer;

    }


    const inputBuffer =
        createBuffer(

            input,

            GPUBufferUsage.STORAGE

        );


    const W1Buffer =
        createBuffer(

            W1,

            GPUBufferUsage.STORAGE

        );


    const B1Buffer =
        createBuffer(

            B1,

            GPUBufferUsage.STORAGE

        );


    const W2Buffer =
        createBuffer(

            W2,

            GPUBufferUsage.STORAGE

        );


    const B2Buffer =
        createBuffer(

            B2,

            GPUBufferUsage.STORAGE

        );


    const hiddenBuffer =
        device.createBuffer({

            size:
                hiddenSize * 4,

            usage:
                GPUBufferUsage.STORAGE |
                GPUBufferUsage.COPY_SRC

        });


    const outputBuffer =
        device.createBuffer({

            size:
                outputSize * 4,

            usage:
                GPUBufferUsage.STORAGE |
                GPUBufferUsage.COPY_SRC

        });


    // =====================================
    // 7. GPUシェーダー
    // =====================================

    const shader =
        device.createShaderModule({

            code: `

                @group(0) @binding(0)
                var<storage, read>
                input : array<f32>;


                @group(0) @binding(1)
                var<storage, read>
                W1 : array<f32>;


                @group(0) @binding(2)
                var<storage, read>
                B1 : array<f32>;


                @group(0) @binding(3)
                var<storage, read_write>
                hidden : array<f32>;


                @compute
                @workgroup_size(1)


                fn main(
                    @builtin(global_invocation_id)
                    id : vec3<u32>
                ) {

                    let i = id.x;


                    if (i >= 4u) {

                        return;

                    }


                    var sum : f32 = 0.0;


                    for (
                        var j : u32 = 0u;
                        j < 2u;
                        j = j + 1u
                    ) {

                        sum =
                            sum +
                            input[j] *
                            W1[i * 2u + j];

                    }


                    sum =
                        sum + B1[i];


                    // ReLU
                    if (sum < 0.0) {

                        sum = 0.0;

                    }


                    hidden[i] = sum;

                }

            `

        });


    // =====================================
    // 8. Pipeline
    // =====================================

    const pipeline =
        device.createComputePipeline({

            layout: "auto",

            compute: {

                module: shader,

                entryPoint: "main"

            }

        });


    // =====================================
    // 9. BindGroup
    // =====================================

    const bindGroup =
        device.createBindGroup({

            layout:
                pipeline.getBindGroupLayout(0),

            entries: [

                {
                    binding: 0,
                    resource: {
                        buffer: inputBuffer
                    }
                },

                {
                    binding: 1,
                    resource: {
                        buffer: W1Buffer
                    }
                },

                {
                    binding: 2,
                    resource: {
                        buffer: B1Buffer
                    }
                },

                {
                    binding: 3,
                    resource: {
                        buffer: hiddenBuffer
                    }
                }

            ]

        });


    // =====================================
    // 10. GPU実行
    // =====================================

    const encoder =
        device.createCommandEncoder();


    const pass =
        encoder.beginComputePass();


    pass.setPipeline(
        pipeline
    );


    pass.setBindGroup(
        0,
        bindGroup
    );


    pass.dispatchWorkgroups(4);


    pass.end();


    // =====================================
    // 11. 結果読み取り用
    // =====================================

    const readBuffer =
        device.createBuffer({

            size:
                hiddenSize * 4,

            usage:
                GPUBufferUsage.COPY_DST |
                GPUBufferUsage.MAP_READ

        });


    encoder.copyBufferToBuffer(

        hiddenBuffer,

        0,

        readBuffer,

        0,

        hiddenSize * 4

    );


    device.queue.submit([

        encoder.finish()

    ]);


    await device.queue.onSubmittedWorkDone();


    // =====================================
    // 12. GPU結果取得
    // =====================================

    await readBuffer.mapAsync(
        GPUMapMode.READ
    );


    const result =
        new Float32Array(

            readBuffer.getMappedRange()

        );


    const values =
        Array.from(result);


    readBuffer.unmap();


    // =====================================
    // 13. 結果表示
    // =====================================

    status.innerHTML = `

        <p>✅ GPUニューラルネット計算成功！</p>

        <p>
        入力：
        [2, 3]
        </p>

        <p>
        隠れ層：
        ${values.join(", ")}
        </p>

        <p>
        次の段階：
        隠れ層 → 出力層
        </p>

    `;

}


main();

</script>

</body>

</html>
