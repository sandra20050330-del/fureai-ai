<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ふれあいの森AI GPU計算</title>
</head>

<body>

<h1>🌲 ふれあいの森AI</h1>

<h2>GPU計算テスト</h2>

<p id="status">計算準備中……</p>

<script>

async function main() {

    const status =
        document.getElementById("status");

    // WebGPU確認
    if (!navigator.gpu) {

        status.textContent =
            "❌ WebGPUがありません";

        return;
    }

    // GPU取得
    const adapter =
        await navigator.gpu.requestAdapter();

    if (!adapter) {

        status.textContent =
            "❌ GPUアダプター取得失敗";

        return;
    }

    // GPUデバイス取得
    const device =
        await adapter.requestDevice();

    // 計算用シェーダー
    const shader = device.createShaderModule({

        code: `

        @group(0) @binding(0)
        var<storage, read_write>
        data : array<f32>;

        @compute @workgroup_size(1)

        fn main() {

            data[0] =
                data[0] + 10.0;

        }

        `
    });

    // データ
    const data =
        new Float32Array([5]);

    // GPUバッファ
    const buffer =
        device.createBuffer({

            size: data.byteLength,

            usage:
                GPUBufferUsage.STORAGE |
                GPUBufferUsage.COPY_SRC |
                GPUBufferUsage.COPY_DST

        });

    // データをGPUへ
    device.queue.writeBuffer(
        buffer,
        0,
        data
    );

    // 読み取り用
    const readBuffer =
        device.createBuffer({

            size: data.byteLength,

            usage:
                GPUBufferUsage.COPY_DST |
                GPUBufferUsage.MAP_READ

        });

    // 計算パイプライン
    const pipeline =
        device.createComputePipeline({

            layout: "auto",

            compute: {

                module: shader,

                entryPoint: "main"

            }

        });

    // BindGroup
    const bindGroup =
        device.createBindGroup({

            layout:
                pipeline.getBindGroupLayout(0),

            entries: [

                {
                    binding: 0,
                    resource: {
                        buffer: buffer
                    }
                }

            ]

        });

    // コマンド作成
    const encoder =
        device.createCommandEncoder();

    const pass =
        encoder.beginComputePass();

    pass.setPipeline(pipeline);

    pass.setBindGroup(
        0,
        bindGroup
    );

    pass.dispatchWorkgroups(1);

    pass.end();

    encoder.copyBufferToBuffer(
        buffer,
        0,
        readBuffer,
        0,
        data.byteLength
    );

    device.queue.submit([
        encoder.finish()
    ]);

    // GPU終了待ち
    await device.queue.onSubmittedWorkDone();

    // GPU結果取得
    await readBuffer.mapAsync(
        GPUMapMode.READ
    );

    const result =
        new Float32Array(
            readBuffer
                .getMappedRange()
        )[0];

    readBuffer.unmap();

    status.textContent =
        "✅ GPU計算成功！ 5 + 10 = "
        + result;

}

main();

</script>

</body>
</html>
